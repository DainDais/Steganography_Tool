<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEGANOS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="crt">
      <div class="stage">
        <div class="frame">
          <header class="head">
            <div>
              <h1>SteganOS</h1>
              <p class="tagline">multi-carrier steganography</p>
            </div>
            <div class="clock" id="clock"></div>
          </header>

          <div class="rule"></div>
          <div class="rule-accent"></div>

          <nav class="breadcrumb" id="breadcrumb"></nav>

          <main class="body" id="body"></main>

          <footer class="keys" id="keys"></footer>
        </div>

        <aside class="assistant" id="assistant">
          <img class="assistant-mascot" src="/clippy.png" alt="Assistant" />
          <div class="assistant-bubble">
            <div class="assistant-body" id="assistant-body"></div>
          </div>
        </aside>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/png,image/bmp" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
